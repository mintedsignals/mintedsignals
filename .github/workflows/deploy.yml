# Rebuilds the static site with fresh market odds and deploys it to Cloudflare.
#
# The site is a static export (see next.config.ts), so the odds are only as fresh as the
# last build. What starts it:
#   - every 30 minutes: a Cloudflare cron trigger on the Worker (worker/index.ts) calls
#     workflow_dispatch. GitHub's own scheduler is best-effort (often late, sometimes skipped),
#     so Cloudflare's punctual timer does the regular work;
#   - every 6 hours: GitHub's schedule below, as a backup in case the Worker's token stops working;
#   - every push to main, and on demand (Actions tab → "Rebuild and deploy" → Run workflow).
# Keep MARKETS_REFRESH_MINUTES in src/config/markets.ts in step with the Cloudflare cron.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   a token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID
#
# If a venue's API is down, the build fails on purpose and the live site keeps its last
# good version. GitHub emails you about failed runs; occasional ones are expected.
name: Rebuild and deploy

on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer run waits for the current one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://mintedsignals.io
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
